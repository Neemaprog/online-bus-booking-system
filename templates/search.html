<!doctype html>
<html lang="sw">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tafuta Basi - BusSafe</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/search.css' %}" />
  </head>
  <body>
    
    <nav class="navbar">
      <div class="logo">BusSafe</div>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="{% url 'search' %}" class="active">Tafuta Basi</a></li>
        <li><a href="#about">About Us</a></li>
        <li><a href="#contact">Contact Us</a></li>
      </ul>
    </nav>

    <!-- Search Form Section -->
    <section class="search-section">
      <div class="container">
        <div class="search-card">
          <h1>Tafuta Safari Yako</h1>
          <p class="subtitle">
            Jaza maelezo hapa chini ili upate mabasi yanayopatikana.
          </p>

          <form
            method="GET"
            action="{% url 'search_results' %}"
            class="search-form"
          >
            <div class="form-group">
              <label for="from">Kutoka</label>
              <select name="from" id="from" required>
                <option value="">Chagua mkoa</option>
                <option value="Dar es Salaam">Dar es Salaam</option>
                <option value="Dodoma">Dodoma</option>
                <option value="Arusha">Arusha</option>
                <option value="Mwanza">Mwanza</option>
                <option value="Mbeya">Mbeya</option>
                <option value="Morogoro">Morogoro</option>
                <option value="Tanga">Tanga</option>
                <option value="Kilimanjaro">Kilimanjaro</option>
                <option value="Mtwara">Mtwara</option>
                <option value="Lindi">Lindi</option>
                <option value="Iringa">Iringa</option>
                <option value="Singida">Singida</option>
                <option value="Tabora">Tabora</option>
                <option value="Kagera">Kagera</option>
                <option value="Shinyanga">Shinyanga</option>
                <option value="Geita">Geita</option>
                <option value="Katavi">Katavi</option>
                <option value="Rukwa">Rukwa</option>
                <option value="Songwe">Songwe</option>
                <option value="Njombe">Njombe</option>
                <option value="Simiyu">Simiyu</option>
                <option value="Ruvuma">Ruvuma</option>
                <option value="Kigoma">Kigoma</option>
                <option value="Pwani">Pwani</option>
                
              </select>
            </div>

            <div class="form-group">
              <label for="to">Kwenda</label>
              <select name="to" id="to" required>
                <option value="">Chagua mkoa</option>
               
                <option value="Dar es Salaam">Dar es Salaam</option>
                <option value="Dodoma">Dodoma</option>
                <option value="Arusha">Arusha</option>
                <option value="Mwanza">Mwanza</option>
                <option value="Mbeya">Mbeya</option>
                <option value="Morogoro">Morogoro</option>
                <option value="Tanga">Tanga</option>
                <option value="Kilimanjaro">Kilimanjaro</option>
                <option value="Mtwara">Mtwara</option>
                <option value="Lindi">Lindi</option>
                <option value="Iringa">Iringa</option>
                <option value="Singida">Singida</option>
                <option value="Tabora">Tabora</option>
                <option value="Kagera">Kagera</option>
                <option value="Shinyanga">Shinyanga</option>
                <option value="Geita">Geita</option>
                <option value="Katavi">Katavi</option>
                <option value="Rukwa">Rukwa</option>
                <option value="Songwe">Songwe</option>
                <option value="Njombe">Njombe</option>
                <option value="Simiyu">Simiyu</option>
                <option value="Ruvuma">Ruvuma</option>
                <option value="Kigoma">Kigoma</option>
                <option value="Pwani">Pwani</option>
                
              </select>
            </div>

            <div class="form-group">
              <label for="date">Tarehe ya Safari</label>
              <input
                type="date"
                name="date"
                id="date"
                required
                min="{% now 'Y-m-d' %}"
              />
            </div>

            <button type="submit" class="btn-submit">Tafuta Mabasi</button>
          </form>
        </div>
      </div>
    </section>


    <footer class="footer">
      <p>© 2025 BusSafe. Haki zote zimehifadhiwa. Safiri salama, book smart.</p>
    </footer>
  </body>
</html>
