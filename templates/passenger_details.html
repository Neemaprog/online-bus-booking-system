<!doctype html>
<html lang="sw">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Details za Abiria - BusSafe</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/passenger_details.css' %}" />
  </head>
  <body>
    <!-- Navbar same as home -->
    <nav class="navbar">
      <div class="logo">BusSafe</div>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="{% url 'search' %}">Tafuta Basi</a></li>
        <li><a href="#about">About Us</a></li>
        <li><a href="#contact">Contact Us</a></li>
      </ul>
    </nav>

    <div class="passenger-container">
      <h2>Details za Abiria</h2>

      <form method="post" action="{% url 'passenger_details' trip.id %}" class="passenger-form">
        {% csrf_token %}
        
        {% for seat in selected_seats %}
        <div class="passenger-section">
          <h3>Abiria {{ forloop.counter }} (Seat-{{ seat }})</h3>
          <input type="hidden" name="seat_{{ forloop.counter }}" value="{{ seat }}" />
          <div class="form-grid">
            <div class="form-group">
                <label>Jina La Kwanza</label>
                <input type="text" name="passenger_{{ forloop.counter }}_first_name" placeholder="Jina la kwanza" required>
            </div>

            <div class="form-group">
                <label>Jina La Mwisho</label>
                <input type="text" name="passenger_{{ forloop.counter }}_last_name" placeholder="Jina la mwisho" required>
            </div>

            <div class="form-group">
                <label>Simu</label>
                <div class="phone-group">
                    <select name="passenger_{{ forloop.counter }}_phone_code">
                        <option>+255</option>
                        <option>+254</option>
                        <option>+256</option>
                    </select>
                    <input type="tel" name="passenger_{{ forloop.counter }}_phone" placeholder="XXXXXXXXXXX" required>
                </div>
            </div>

            <div class="form-group">
                <label>Jinsi</label>
                <select name="passenger_{{ forloop.counter }}_gender" required>
                    <option value="">Chagua jinsia</option>
                    <option value="Mume">Mume</option>
                    <option value="Mwanamke">Mwanamke</option>
                    <option value="Nyingine">Badala ya jinsia (Other)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Umri</label>
                <select name="passenger_{{ forloop.counter }}_age_group" required>
                    <option value="">Chagua umri</option>
                    <option value="Mtoto">Mtoto (0-12)</option>
                    <option value="Kijana">Kijana (13-17)</option>
                    <option value="Mtu mzima">Mtu mzima (18-59)</option>
                    <option value="Mzee">Mzee (60+)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Aina ya Kitambulisho</label>
                <select name="passenger_{{ forloop.counter }}_id_type">
                    <option value="">Chagua aina ya kitambulisho</option>
                    <option value="NIDA">NIDA</option>
                    <option value="Passport">Passport</option>
                    <option value="Driving License">Driving License</option>
                    <option value="Voting Card">Voting Card</option>
                </select>
            </div>

            <div class="form-group">
                <label>Namba ya Kitambulisho</label>
                <input type="text" name="passenger_{{ forloop.counter }}_id_number" placeholder="Namba ya kitambulisho">
            </div>

            <div class="form-group">
                <label>Uraia</label>
                <select name="passenger_{{ forloop.counter }}_nationality" required>
                    <option value="Tanzania">Tanzania</option>
                    <option value="Kenya">Kenya</option>
                    <option value="Uganda">Uganda</option>
                    <option value="Rwanda">Rwanda</option>
                    <option value="Burundi">Burundi</option>
                    <option value="Zambia">Zambia</option>
                    <option value="Malawi">Malawi</option>
                    <option value="Nyingine">Nyingine</option>
                </select>
            </div>
          </div>
        </div>
        {% if not forloop.last %}<hr>{% endif %}
        {% endfor %}

<div class="total-section">
    <div class="total-price">
        <label>Jumla</label>
        <span>TZS {{ total_price|floatformat:0 }}</span>
    </div>
  <button type="submit" class="continue-btn">ENDELEA</button>
</div>
       
        </div>
      </form>
    </div>
  </body>
</html>
